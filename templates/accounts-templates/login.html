{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html><html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% trans "Log in" %} | HourBank</title><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/dashboard.css' %}"><style>.login-error{margin-bottom:15px;padding:13px 16px;border:1px solid #ecc9d2;border-radius:12px;color:#a73e56;background:#fff2f5}.forgot-password{display:inline-block;margin-top:10px;color:#4b718a;font-size:12px;font-weight:700;text-decoration:none}.forgot-password:hover{text-decoration:underline}</style></head><body class="hb-page"><main class="hb-main"><div class="hb-shell"><form class="hb-card form-card" method="post">{% csrf_token %}<div class="page-head"><div><span class="eyebrow">HourBank</span><h1>{% trans "Log in" %}</h1><p>{% trans "Welcome back" %}</p></div></div>{% for message in messages %}<div class="login-error" role="alert">{{ message }}</div>{% endfor %}<div class="field"><label for="username">{% trans "Username" %}</label><input class="form-control" id="username" name="username" value="{{ request.POST.username }}" required autocomplete="username"></div><div class="field"><label for="password">{% trans "Password" %}</label><input class="form-control" id="password" type="password" name="password" required autocomplete="current-password"><a class="forgot-password" href="{% url 'accounts:password_reset' %}">{% trans "Forgot your password?" %}</a></div><div class="actions-row"><button class="hb-btn" type="submit">{% trans "Log in" %}</button><a class="hb-btn secondary" href="{% url 'accounts:register' %}">{% trans "Create account" %}</a></div></form></div></main></body></html>
