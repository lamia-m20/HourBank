{% load static i18n %}{% get_current_language as LANGUAGE_CODE %}<!doctype html><html lang="{{ LANGUAGE_CODE }}" dir="{% if LANGUAGE_CODE == 'ar' %}rtl{% else %}ltr{% endif %}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% trans "Reset password" %} | HourBank</title><link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="{% static 'css/dashboard.css' %}"></head><body class="hb-page"><main class="hb-main"><div class="hb-shell"><form class="hb-card form-card" method="post">{% csrf_token %}<div class="page-head"><div><span class="eyebrow">HourBank</span><h1>{% trans "Reset password" %}</h1><p>{% trans "Enter the email associated with your account." %}</p></div></div><div class="field"><label for="id_email">{% trans "Email" %}</label><input class="form-control" id="id_email" name="email" type="email" autocomplete="email" required>{{ form.email.errors }}</div><div class="actions-row"><button class="hb-btn" type="submit">{% trans "Send password reset link" %}</button><a class="hb-btn secondary" href="{% url 'accounts:login' %}">{% trans "Log in" %}</a></div></form></div></main></body></html>
